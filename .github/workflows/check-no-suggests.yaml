# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-no-suggests.yaml).
# R CMD check with only the hard dependencies (Depends, Imports) installed, plus testthat, knitr and rmarkdown.
# CRAN also checks packages without their Suggests: every use of a suggested package must be guarded.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: check-no-suggests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-no-suggests:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - name: List the Suggests that are installed (only testthat, knitr, rmarkdown expected)
        shell: Rscript {0}
        run: |
          sugg <- trimws(strsplit(read.dcf("DESCRIPTION", fields = "Suggests")[[1]], ",")[[1]])
          sugg <- sub("[ (].*$", "", sugg)
          installed <- sugg[vapply(sugg, requireNamespace, logical(1), quietly = TRUE)]
          message("Suggests installed: ", if (length(installed)) toString(installed) else "none")

      - uses: r-lib/actions/check-r-package@v2
        env:
          # As in R-CMD-check.yaml: skip only the remote CRAN-incoming checks ("New submission", private-repo URLs).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
