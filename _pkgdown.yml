      - mascot_examples
      - mascot_example
      - mascot_studio

articles:
  - title: Get started
    navbar: ~
    contents:
      - mascot
  - title: Changelog
    navbar: Changelog
    contents:
      - articles/engine-changelog
  - title: Studio guide
    navbar: ~
    desc: The guide pages of the mascot studio, one per function. Their source is in inst/examples/studio/guide/.
    contents:
      - starts_with("articles/guide-")
