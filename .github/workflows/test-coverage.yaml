# Derived from https://github.com/r-lib/actions/tree/v2/examples (test-coverage.yaml), without Codecov
# (the repo is private). Fails when line coverage is under the limit in DESCRIPTION (Config/cran-gate/coverage,
# 70%), the same limit the gate uses.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the tests CRAN skips (shinytest2 needs Chrome, which the runner has), so they count towards coverage.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage (at least the limit in DESCRIPTION)
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          message(sprintf("Line coverage: %.1f%%", pct))
          limit <- as.numeric(read.dcf("DESCRIPTION", fields = "Config/cran-gate/coverage")[[1]])
          if (is.na(limit)) limit <- 70
          if (pct < limit) stop(sprintf("Coverage %.1f%% is under %g%%.", pct, limit), call. = FALSE)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
