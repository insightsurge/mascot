name: release

# Tags vX.Y.Z and creates a GitHub release. Started by hand (Actions > release > Run workflow, on main), only after
# CRAN has accepted the version: a release is never made on merge, because CRAN may ask for changes first and a
# published tag can never move. The commit input is the commit to release (default: the tip of main); it must be on
# main. Development versions (X.Y.Z.9000) and milestone releases (0.0.x) use the same path; a development version is
# published as a pre-release. The checks, the tag and the release are in .github/scripts/release-check.sh (tried
# locally with test-release-check.sh in the same folder). Notes: the NEWS.md section for the version, then notes
# generated from PR labels (.github/release.yml).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to release, as a SHA on main (empty: the tip of main)
        required: false
        default: ""
        type: string

permissions: {}

# One release at a time, and a started release is never cancelled half done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04  # pinned, like gitleaks
    timeout-minutes: 10  # checks, then tags and creates a GitHub release (a run takes under a minute)
    permissions:
      contents: write  # creates the tag and the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0  # the history, to see that the commit is on main, and every tag
          persist-credentials: false
      - name: Check, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit || github.sha }}
        run: bash .github/scripts/release-check.sh --publish "$COMMIT"
