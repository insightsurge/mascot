# Runs the test files that hold browser tests (shinytest2 and chromote) with Chrome, on R release and R 4.1; R CMD
# check and the coverage job skip the browser tests, as CRAN does. One line per test file as it finishes shows the
# progress while the job runs, and a failing test prints in full. A pull request that changes only documentation
# starts the jobs and skips their steps (.github/scripts/r-changes.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC, with R-CMD-check: catches a new Chrome or shinytest2

name: browser-tests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    name: browser (${{ matrix.r }})
    timeout-minutes: 60  # the whole suite with Chrome

    strategy:
      fail-fast: false
      matrix:
        # R 4.1 too: the studio's server code runs only inside the browser tests' apps, so this is where it meets the
        # oldest R the package supports.
        r: ['release', '4.1']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the tests CRAN skips: the browser tests (the runner has Chrome).
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: local::.
          needs: check

      - name: Run the tests with Chrome
        if: steps.changes.outputs.r == 'true'
        shell: Rscript {0}
        run: |
          chrome <- chromote::find_chrome()
          if (is.null(chrome)) stop("No Chrome on this runner: the browser tests would all skip.", call. = FALSE)
          message("Chrome: ", system2(chrome, "--version", stdout = TRUE))
          library(testthat)
          library(mascot)
          # The test files that open Chrome: the ones that call a helper starting a browser or a page. R CMD check runs
          # every file without Chrome, so the other tests in these files run twice; keeping browser tests in files of
          # their own is the next step.
          opens_chrome <- paste0(
            "local_shiny_browser\\(|skip_without_chrome\\(|app_driver\\(|local_chrome_session\\(|find_chrome\\(|",
            "test_browser\\(|local_(host|engine|runtime)_page\\(|local_(character|face)_engine\\("
          )
          files <- list.files("tests/testthat", "^test-.*[.]R$")
          files <- files[vapply(
            file.path("tests/testthat", files),
            function(file) any(grepl(opens_chrome, readLines(file, warn = FALSE))),
            logical(1)
          )]
          message(length(files), " files with browser tests: ", paste(files, collapse = ", "))
          # A line per file when it finishes (update_interval = Inf: no progress spinner in a log); failures in full.
          results <- testthat::test_dir(
            "tests/testthat",
            filter = paste0("^(", paste(sub("^test-(.*)[.]R$", "\\1", files), collapse = "|"), ")$"),
            package = "mascot",
            load_package = "installed",
            reporter = testthat::ProgressReporter$new(show_praise = FALSE, update_interval = Inf),
            stop_on_failure = FALSE
          )
          # This job is for the browser tests, so a browser test that skips fails it: a Chrome that keeps stopping, a
          # missing package (shinytest2, chromote, bslib, knitr) or NOT_CRAN not reaching the tests ("On CRAN").
          skips <- unlist(lapply(results, function(test) {
            vapply(Filter(function(e) inherits(e, "expectation_skip"), test$results), conditionMessage, character(1))
          }))
          browser_skips <- unique(grep("Chrome|On CRAN|not installed", skips, value = TRUE))
          if (length(browser_skips) > 0L) message("Browser tests skipped: ", paste(browser_skips, collapse = "; "))
          failed <- as.data.frame(results)
          if (any(failed$failed > 0L | failed$error) || length(browser_skips) > 0L) {
            stop("Browser tests failed or were skipped; see above.", call. = FALSE)
          }

  # One check name for the branch ruleset to require: it fails unless the job above succeeded on every R version.
  browser-tests:
    needs: browser
    if: always()
    runs-on: ubuntu-26.04
    name: browser-tests
    timeout-minutes: 5  # only reads the matrix result
    steps:
      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = "success"
