# Derived from https://github.com/r-lib/actions/tree/v2/examples (test-coverage.yaml).
# Fails when line coverage is under the limit in DESCRIPTION (Config/cran-gate/coverage,
# 70% when the field is missing), the same limit the gate uses. A pull request is held to the higher of its base
# branch's limit and its own, so a pull request cannot lower the limit by editing DESCRIPTION; changes to this
# workflow are reviewed like any other change. A push to main reads the checked-out DESCRIPTION. The browser tests
# skip here, as on CRAN (browser-tests.yaml runs them): this is the coverage the tests give without Chrome. A pull
# request that changes only documentation starts the job and skips its steps (.github/scripts/r-changes.sh).
# The coverage part of the pull request's CI report (.github/pr-report.json): the figure, the difference from main and
# the added R/ lines these tests don't run, in the job summary and, through the report job, in the comment.
# The figure also goes to Codecov for the README badge (pushes to main and this repository's pull requests; forks and
# Dependabot have no CODECOV_TOKEN). Codecov only reports (codecov.yml: no comments, informational statuses); this
# job enforces the limit. It counts the R code run in the test process, not the JavaScript engine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 60  # the tests without Chrome under covr: 9-11 min, plus room for a slow package mirror
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      # The base branch name comes in through env, never written into the script, so it can't inject commands.
      - name: Read the coverage limit from the base branch (pull requests)
        if: github.event_name == 'pull_request' && steps.changes.outputs.r == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          git show FETCH_HEAD:DESCRIPTION > "${RUNNER_TEMP}/base-DESCRIPTION"
        shell: bash

      - name: Test coverage (at least the limit in DESCRIPTION)
        if: steps.changes.outputs.r == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          # As CRAN: setup-r sets NOT_CRAN to true, which would run the browser tests here too.
          NOT_CRAN: false
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          message(sprintf("Line coverage: %.1f%%", pct))
          if (Sys.getenv("EVENT_NAME") == "pull_request" &&
            !file.exists(file.path(Sys.getenv("RUNNER_TEMP"), "base-DESCRIPTION"))) {
            stop("The base branch's DESCRIPTION was not read.", call. = FALSE)
          }
          read_limit <- function(file) {
            value <- as.numeric(read.dcf(file, fields = "Config/cran-gate/coverage")[[1]])
            if (is.na(value)) 70 else value
          }
          limit <- read_limit("DESCRIPTION")
          if (Sys.getenv("EVENT_NAME") == "pull_request") {
            limit <- max(read_limit(file.path(Sys.getenv("RUNNER_TEMP"), "base-DESCRIPTION")), limit)
          }
          # Kept before the limit check, for the report: "under the limit" is a measurement, a failed test is not.
          report <- file.path(Sys.getenv("RUNNER_TEMP"), "coverage-report")
          dir.create(report, showWarnings = FALSE)
          saveRDS(cov, file.path(report, "coverage.rds"))
          write.dcf(data.frame(Percent = pct, Limit = limit, Passed = pct >= limit), file.path(report, "coverage.dcf"))
          if (pct < limit) stop(sprintf("Coverage %.1f%% is under %g%%.", pct, limit), call. = FALSE)
        shell: Rscript {0}

      - name: Show testthat output
        if: always() && steps.changes.outputs.r == 'true'
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Write the Cobertura report for Codecov
        id: cobertura
        if: >-
          always() && steps.changes.outputs.r == 'true' &&
          (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          COV_DIR: ${{ runner.temp }}/coverage-report
        # No coverage.rds when the tests failed before covr finished: nothing to upload then.
        run: |
          rds <- file.path(Sys.getenv("COV_DIR"), "coverage.rds")
          if (file.exists(rds)) {
            covr::to_cobertura(readRDS(rds), filename = file.path(Sys.getenv("COV_DIR"), "cobertura.xml"))
            cat("written=true\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          }
        shell: Rscript {0}

      # Codecov being down is not a test failure: fail_ci_if_error stays false, so a failed upload only warns.
      - name: Upload coverage to Codecov
        if: always() && steps.cobertura.outputs.written == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage-report/cobertura.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

      - name: Get main's coverage (pull requests)
        id: baseline
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.r == 'true'
        uses: ./.github/actions/main-baseline
        with:
          workflow: test-coverage.yaml
          artifact: coverage-baseline
          path: ${{ runner.temp }}/coverage-baseline

      - name: Write the coverage report
        if: always() && steps.changes.outputs.r == 'true'
        env:
          COV_DIR: ${{ runner.temp }}/coverage-report
          BASELINE_DIR: ${{ runner.temp }}/coverage-baseline
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          OUT: ${{ runner.temp }}/coverage-part.md
        run: Rscript .github/scripts/coverage-report.R

      # When R didn't run: a documentation-only change, or a failure before the report step.
      - name: Write the coverage report (when R didn't run)
        if: always()
        env:
          R_STEPS: ${{ steps.changes.outputs.r }}
          JOB_STATUS: ${{ job.status }}
          OUT: ${{ runner.temp }}/coverage-part.md
        run: |
          if [ -s "${OUT}" ]; then exit 0; fi
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            echo "⏹️ **Coverage:** not measured: the job was cancelled." > "${OUT}"
          elif [ "${R_STEPS}" = "false" ]; then
            echo "⏭️ **Coverage:** not measured: this pull request changes only documentation." > "${OUT}"
          else
            echo "❌ **Coverage:** not measured: the job failed before the tests ran (see the run's log)." > "${OUT}"
          fi

      - name: Keep the coverage report
        if: always()
        uses: ./.github/actions/pr-report-part
        with:
          name: tests-1-coverage
          file: ${{ runner.temp }}/coverage-part.md

      # The figure pull requests are compared with.
      - name: Keep main's coverage
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/coverage-report/coverage.dcf
          retention-days: 90
          overwrite: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: test-coverage
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request, across the workflows that write the comment.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.github/actions/pr-report-comment
        with:
          config: .github/pr-report.json
