# pkgdown site with the R Engineering Playbook's look (#25).
# Colours come from the playbook's _brand.yml (blog variant), itself copied from the website repo's brand/
# (source of truth); fonts are the playbook's self-hosted latin subsets (OFL, pkgdown/assets/fonts/).
# The aurora background and the dark palette are in pkgdown/extra.css.
url: https://insightsurge.github.io/mascot/   # GitHub Pages, once the repo is public
# docs/ holds the project's own notes, so the site builds into site/ (git- and build-ignored).
destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F5F6F4"          # stone-25
    fg: "#16201B"          # stone-ink
    primary: "#16201B"     # stone-ink (the blog surface uses ink for buttons)
    secondary: "#525D57"   # stone-600
    success: "#1D6B45"     # green-600
    info: "#2F5F86"        # blue-600
    warning: "#7A5A12"     # ochre-600
    danger: "#A33A30"      # red-600
    link-color: "#1D5A43"  # forest-700
    base_font: "Space Grotesk"
    heading_font: "Space Grotesk"
    code_font: "JetBrains Mono"
    border-radius: 8px
    border-radius-sm: 6px
    border-radius-lg: 12px
    link-underline-offset: 0.2em
  includes:
    before_body: |
      <div class="site-aurora-bg" aria-hidden="true">
        <div class="site-aurora-bg__glows"><div class="site-aurora__glow"></div></div>
        <div class="site-aurora__grain"></div>
      </div>

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
  - title: Package
    contents:
      - mascot-package
  - title: Mascots in Shiny
    contents:
      - mascot
      - updateMascot
  - title: Helpers
    contents:
      - mascot_character
      - mascot_mood
      - mascot_status
      - mascot_bubble
      - mascot_gesture
      - mascot_gestures
      - mascot_moods
