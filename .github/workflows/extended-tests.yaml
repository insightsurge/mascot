# R CMD check on macOS and Windows with the extended tests turned on (EXTENDED_TESTS: the example apps' detailed tests
# in tests/testthat/test-*-extended.R). Pull requests run those tests only on Ubuntu (test-coverage.yaml and
# off-cran-tests.yaml), so this is where they meet the other systems: every Monday and on demand. The browser tests
# still skip: they need Chrome. A workflow of its own, so a failure here leaves R-CMD-check (and its README badge) as
# it is: it is a warning to fix before the next release. macOS runs R release only: for R 4.1 on Apple silicon there
# are no ready-built packages, and building them from source broke on the runner's OpenSSL (#568).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC, with R-CMD-check

name: extended-tests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120  # as R-CMD-check: installing R 4.1 and building packages from source can be slow
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: 'macos-latest', r: 'release'}
          - {os: 'windows-latest', r: 'release'}
          - {os: 'windows-latest', r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN, apart from the extended tests: the browser tests skip.
          NOT_CRAN: false
          EXTENDED_TESTS: true
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          # The extended tests make the check slower than CRAN's: only errors and warnings count here.
          error-on: '"warning"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
