name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reprex
    attributes:
      label: Minimal reproducible example
      description: Ideally made with reprex::reprex().
      render: r
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session info
      description: Output of sessioninfo::session_info() or sessionInfo(); browser and version for Shiny or Quarto issues.
      render: text
