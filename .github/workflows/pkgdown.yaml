# Derived from https://github.com/r-lib/actions/tree/v2/examples (pkgdown.yaml).
# Builds the pkgdown site on every PR and push to main, and uploads it as an artifact (download, unzip, open
# index.html). No deploy yet: GitHub Pages on a private repo needs a paid plan; add the deploy step once the repo is
# public (#25).
on:
  push:
    branches: [main]
  pull_request:
    # Only when something the site shows has changed (to save minutes while the repo is private; revisit in #115).
    paths:
      - "README.md"
      - "NEWS.md"
      - "DESCRIPTION"
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "_pkgdown.yml"
      - "pkgdown/**"
      - "tools/build-site.R"
      - ".github/CONTRIBUTING.md"
      - ".github/workflows/pkgdown.yaml"
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check the site configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      # tools/build-site.R keeps CLAUDE.md and AGENTS.md out of the site (pkgdown renders every top-level .md).
      - name: Build the site
        run: Rscript tools/build-site.R

      - uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site
          path: site/
          retention-days: 14
