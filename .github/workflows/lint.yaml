# Style, docs in sync and spelling: the quality gate's lint mode. Linux only. The check itself is launchR's; this file
# says when it runs (README.md in this folder).
name: lint

on:
  pull_request:   # every pull request, also one stacked on another branch
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

# A new push to a pull request stops this check's older run for it, to save minutes; pushes and weekly runs always
# finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/lint.yaml@v0.0.19
    with:
      ci-report: true
