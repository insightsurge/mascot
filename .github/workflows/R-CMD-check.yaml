# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-standard.yaml).
# The repo rule is 0 errors, 0 warnings, 0 notes, so any note fails the check. As on CRAN, the browser, snapshot and
# extended tests skip here: off-cran-tests.yaml runs them. Every pull request, push to main, weekly run and manual run
# checks the full matrix. On Ubuntu with R release the check also fails when the tests take longer than the limit, so
# the time CRAN spends on them stays well inside its 10 minutes for the whole check. The weekly and manual runs also
# check macOS and Windows with the extended tests turned on (the extended job), the only place they meet those systems.
# The R-CMD-check line of the pull request's CI report (.github/pr-report.json) says whether every platform passed and
# how long the tests took against the limit. A pull request that changes only documentation starts the jobs and skips
# their steps (.github/scripts/r-changes.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC: catches changes in R-devel and in dependencies

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120  # about twice the slowest run: R-devel took 56 min on a slow day (installing R 12-20 min
    # from a slow package mirror, then building packages from source); usually 7-14 min

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned like the repo's other workflows.
        config:
          - {os: 'macos-latest', r: 'release'}
          - {os: 'windows-latest', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'devel', http-user-agent: 'release'}
          - {os: 'ubuntu-26.04', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'oldrel-1'}
          - {os: 'ubuntu-26.04', r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        if: steps.changes.outputs.r == 'true'
        env:
          # Skip only the remote CRAN-incoming checks: they always give a "New submission" note for an
          # unreleased package (explained in cran-comments.md when we submit).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN: setup-r sets NOT_CRAN to true, which would run the browser tests here too.
          NOT_CRAN: false
          # As CRAN: a note when the tests use more than 2.5 times as much CPU time as elapsed time. testthat runs the
          # test files in two processes (Config/testthat/parallel in DESCRIPTION), which uses about twice as much.
          _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
          # The whole test output when a test fails, not only its last 13 lines.
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      # The time the tests take as CRAN runs them, against a limit with room for the package to grow: CRAN asks for
      # examples, vignettes and tests to take under 10 minutes together, and its Windows machine has been more than
      # twice as slow as its Debian one. Here the tests took 384-503 s before the example apps' detailed tests moved to
      # -extended.R files (#568). Measured on one runner only, so the figure stays comparable from run to run.
      - name: Check the tests' time against the limit
        if: steps.changes.outputs.r == 'true' && matrix.config.os == 'ubuntu-26.04' && matrix.config.r == 'release'
        shell: Rscript {0}
        env:
          LIMIT_SECONDS: 180
          OUT: ${{ runner.temp }}/test-time.dcf
        run: |
          log <- readLines(file.path("check", "mascot.Rcheck", "00check.log"), warn = FALSE)
          line <- grep("Running .testthat[.]R.", log, value = TRUE)
          # R CMD check prints "[CPU/elapsed]" (as "123s/61s" or "17m/9m") only when the tests take a while.
          times <- regmatches(line, regexec("\\[([0-9.]+)([sm])/([0-9.]+)([sm])\\]", line))[[1]]
          elapsed <- if (length(times) == 5L) as.numeric(times[[4]]) * if (times[[5]] == "m") 60 else 1 else 0
          limit <- as.numeric(Sys.getenv("LIMIT_SECONDS"))
          write.dcf(data.frame(Elapsed = elapsed, Limit = limit), Sys.getenv("OUT"))
          message(sprintf("The tests took %g s elapsed; the limit is %g s.", elapsed, limit))
          if (elapsed > limit) {
            stop(
              sprintf(
                "The tests took %g s, over the %g s limit. Move detailed tests of an example app to a -extended.R file (tests/testthat/helper-extended.R) or make them faster.",
                elapsed, limit
              ),
              call. = FALSE
            )
          }

      - name: Keep the tests' time
        if: always() && steps.changes.outputs.r == 'true' && matrix.config.os == 'ubuntu-26.04' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: cran-test-time
          path: ${{ runner.temp }}/test-time.dcf
          if-no-files-found: ignore

  # Weekly and on demand: R CMD check on macOS and Windows with the extended tests turned on (MASCOT_EXTENDED_TESTS),
  # which the pull requests run only on Ubuntu (the coverage and off-CRAN jobs). The browser tests still skip: they
  # need Chrome. Not part of the R-CMD-check summary: a failure here is a warning to fix before the next release.
  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120  # as the check job: installing R 4.1 and building packages from source can be slow
    name: extended ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: 'macos-latest', r: 'release'}
          - {os: 'macos-latest', r: '4.1'}
          - {os: 'windows-latest', r: 'release'}
          - {os: 'windows-latest', r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN, apart from the extended tests: the browser tests skip.
          NOT_CRAN: false
          MASCOT_EXTENDED_TESTS: true
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          # The extended tests make the check slower than CRAN's: only errors and warnings count here.
          error-on: '"warning"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  # One stable check name that sums up the jobs above (a branch ruleset could require it): it fails unless every
  # matrix job above succeeded.
  R-CMD-check:
    needs: check
    if: always()
    runs-on: ubuntu-26.04
    name: R-CMD-check
    timeout-minutes: 5  # only reads the matrix result
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Get the tests' time
        uses: actions/download-artifact@v8
        continue-on-error: true  # none when the R steps were skipped or the check stopped before the tests
        with:
          name: cran-test-time
          path: ${{ runner.temp }}/test-time

      - name: Write the report
        env:
          RESULT: ${{ needs.check.result }}
          TIME_FILE: ${{ runner.temp }}/test-time/test-time.dcf
          OUT: ${{ runner.temp }}/check-part.md
        shell: Rscript {0}
        run: |
          result <- Sys.getenv("RESULT")
          status <- switch(result,
            success = "\u2705 **R CMD check (as CRAN):** every platform passed",
            cancelled = "\u23f9\ufe0f **R CMD check (as CRAN):** cancelled",
            "\u274c **R CMD check (as CRAN):** a platform failed (see the run)"
          )
          time <- if (file.exists(Sys.getenv("TIME_FILE"))) {
            t <- read.dcf(Sys.getenv("TIME_FILE"))
            sprintf(" · tests %s s on Ubuntu, R release (limit %s s)", t[1, "Elapsed"], t[1, "Limit"])
          } else {
            " · tests not timed (a documentation-only change, or the check stopped first)"
          }
          writeLines(paste0(status, time), Sys.getenv("OUT"))

      - name: Keep the report
        uses: ./.github/actions/pr-report-part
        with:
          name: tests-0-check
          file: ${{ runner.temp }}/check-part.md

      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = "success"

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summaries only: their token can't write to the pull request.
  report:
    needs: [check, R-CMD-check]  # after the summary job too, so the run counts as finished
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request, across the workflows that write the comment.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.github/actions/pr-report-comment
        with:
          config: .github/pr-report.json
