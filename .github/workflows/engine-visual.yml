name: engine-visual

# Manual only while private (#113). Add reviewed engine/character PR paths under
# #115 before public release. Never regenerate or promote baselines automatically.
on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    # Founder-approved exception to the usual ubuntu-26.04 host, 2026-10-15.
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.lock.outputs.image }}
      chrome: ${{ steps.lock.outputs.chrome }}
      library: ${{ steps.lock.outputs.library }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a committed, complete canonical profile
        id: lock
        shell: python
        run: |
          import json, os, pathlib, re
          path = pathlib.Path('tools/visual/profile-lock.json')
          if not path.is_file():
              raise SystemExit('Canonical profile is pending. Review and commit profile-lock.json first; the template is not a lock.')
          profile = json.loads(path.read_text())
          if profile.get('status') != 'locked':
              raise SystemExit('Profile is not locked')
          image = profile['container']
          if not re.fullmatch(r'[a-z0-9./:_-]+@sha256:[a-f0-9]{64}', image):
              raise SystemExit('A pre-provisioned image pinned by digest is required; this job installs nothing')
          values = {'image': image, 'chrome': profile['chrome_path'], 'library': profile['r_library']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  if not isinstance(value, str) or '\n' in value or '\r' in value:
                      raise SystemExit('Invalid profile output')
                  output.write(f'{key}={value}\n')

  capture:
    needs: profile
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.profile.outputs.image }}
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      R_LIBS: ${{ needs.profile.outputs.library }}
      CHROMOTE_CHROME: ${{ needs.profile.outputs.chrome }}
      MASCOT_VISUAL_CONTAINER: ${{ needs.profile.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Capture old main twice and reject a missing-eye defect
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual/visual-baselines.py capture --strict --profile tools/visual/profile-lock.json --source ace06f5 --output dev/visual-baselines/canonical-old
          python3 tools/visual/visual-baselines.py capture --strict --profile tools/visual/profile-lock.json --source ace06f5 --output dev/visual-baselines/canonical-repeat
          python3 tools/visual/visual-baselines.py archive --baseline dev/visual-baselines/canonical-old
          archives=(dev/visual-baselines/*.tar.gz)
          archive="${archives[0]}"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          python3 tools/visual/visual-baselines.py compare --strict --profile tools/visual/profile-lock.json --baseline dev/visual-baselines/canonical-old --candidate dev/visual-baselines/canonical-repeat --archive-file "$archive" --archive-sha256 "$digest"
          python3 tools/visual/visual-baselines.py probe --strict --profile tools/visual/profile-lock.json --source ace06f5 --baseline dev/visual-baselines/canonical-old --archive-file "$archive" --archive-sha256 "$digest"
      - name: Upload archive and checksums for manual review and retained storage
        uses: actions/upload-artifact@v7
        with:
          name: canonical-tessa-baselines
          path: |
            dev/visual-baselines/*.tar.gz
            dev/visual-baselines/*.sha256
            dev/visual-baselines/canonical-old/manifest.json
          if-no-files-found: error
          retention-days: 30
