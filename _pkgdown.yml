# pkgdown site (#451): Hanken Grotesk and JetBrains Mono (self-hosted, OFL, pkgdown/assets/fonts/), teal on a
# cool ground in light and dark. The colours below are repeated as tokens in pkgdown/extra.css, which also holds
# the glow, the reading width and the component styles: change both together.
url: https://insightsurge.github.io/mascot/   # GitHub Pages, once the repo is public
# docs/ holds the project's own notes, so the site builds into site/ (git- and build-ignored).
destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F5FAFC"
    fg: "#172E36"
    body-bg-dark: "#101E22"
    body-color-dark: "#E7F3F5"
    primary: "#145C68"
    secondary: "#3C5861"
    success: "#1D6B45"
    info: "#2F5F86"
    warning: "#7A5A12"
    danger: "#A33A30"
    link-color: "#145C68"
    link-color-dark: "#8CE1E4"
    base_font: "Hanken Grotesk"
    heading_font: "Hanken Grotesk"
    code_font: "JetBrains Mono"
    font-size-root: "17px"
    line-height-base: 1.65
    headings-font-weight: 650
    border-radius: "0.6rem"
    border-radius-sm: "0.35rem"
    border-radius-lg: "0.8rem"
    link-underline-offset: "0.2em"

navbar:
  components:
    intro:
      text: Get started
      href: articles/mascot.html
    meet:
      text: Meet your mascots
      href: articles/meet-your-mascots.html
    changelog:
      text: Changelog
      menu:
        - text: "R package"
          href: news/index.html
        - text: "Engine"
          href: articles/engine-changelog.html
    guide:
      text: Studio guide
      menu:
        - text: "Character and mood"
        - text: "mascot_character()"
          href: articles/guide-mascot_character.html
        - text: "mascot_read_character()"
          href: articles/guide-mascot_read_character.html
        - text: "mascot_check_character()"
          href: articles/guide-mascot_check_character.html
        - text: "mascot_mood()"
          href: articles/guide-mascot_mood.html
        - text: "mascot_moods()"
          href: articles/guide-mascot_moods.html
        - text: "mascot_characters()"
          href: articles/guide-mascot_characters.html
        - text: "mascot_families()"
          href: articles/guide-mascot_families.html
        - text: "mascot_anchors()"
          href: articles/guide-mascot_anchors.html
        - text: "Messages and clicks"
        - text: "mascot_status()"
          href: articles/guide-mascot_status.html
        - text: "mascot_bubble()"
          href: articles/guide-mascot_bubble.html
        - text: "mascot_action()"
          href: articles/guide-mascot_action.html
        - text: "mascot_popup_menu()"
          href: articles/guide-mascot_popup_menu.html
        - text: "Motion and gestures"
        - text: "mascot_motion_settings()"
          href: articles/guide-mascot_motion_settings.html
        - text: "mascot_gesture()"
          href: articles/guide-mascot_gesture.html
        - text: "mascot_gestures()"
          href: articles/guide-mascot_gestures.html
        - text: "Size and placement"
        - text: "mascot_size()"
          href: articles/guide-mascot_size.html
        - text: "mascot_placement()"
          href: articles/guide-mascot_placement.html
        - text: "Colours and theme"
        - text: "mascot_colour_roles()"
          href: articles/guide-mascot_colour_roles.html
        - text: "mascot_palettes()"
          href: articles/guide-mascot_palettes.html
        - text: "mascot_theme()"
          href: articles/guide-mascot_theme.html
        - text: "Wiring it in Shiny"
        - text: "mascot()"
          href: articles/guide-mascot.html
        - text: "update_mascot()"
          href: articles/guide-update_mascot.html
        - text: "Preview page"
        - text: "mascot_preview()"
          href: articles/guide-mascot_preview.html
        - text: "Bundled examples"
        - text: "mascot_examples()"
          href: articles/guide-mascot_examples.html
        - text: "mascot_example()"
          href: articles/guide-mascot_example.html
        - text: "mascot_studio()"
          href: articles/guide-mascot_studio.html
  structure:
    left: [intro, meet, reference, guide, changelog]
    right: [search, github, lightswitch]

reference:
  - title: Package
    contents:
      - mascot-package
  - title: Mascots in Shiny
    contents:
      - mascot
      - update_mascot
  - title: Helpers
    desc: >
      Knurl and Neer (mascot_character(), mascot_characters()), mascot_read_character(),
      mascot_check_character(), mascot_theme(css =) and mascot_placement(drag = "free") are experimental.
    contents:
      - mascot_character
      - mascot_read_character
      - mascot_check_character
      - mascot_mood
      - mascot_size
      - mascot_placement
      - mascot_action
      - mascot_popup_menu
      - mascot_motion_settings
      - mascot_theme
      - mascot_styling
      - mascot_colour_roles
      - mascot_status
      - mascot_bubble
      - mascot_gesture
      - mascot_gestures
      - mascot_moods
      - mascot_characters
      - mascot_families
      - mascot_anchors
      - mascot_palettes

  - title: Examples
    desc: mascot_preview() and mascot_studio() are experimental.
    contents:
      - mascot_preview
      - mascot_examples
      - mascot_example
      - mascot_studio

articles:
  - title: Get started
    navbar: ~
    contents:
      - mascot
  - title: Meet your mascots
    navbar: ~
    contents:
      - articles/meet-your-mascots
  - title: Make your own
    navbar: Make your own
    contents:
      - articles/write-your-own-character
  - title: Changelog
    navbar: Changelog
    contents:
      - articles/engine-changelog
  - title: Studio guide
    navbar: ~
    desc: The guide pages of the mascot studio, one per function. Their source is in inst/examples/studio/guide/.
    contents:
      - starts_with("articles/guide-")
