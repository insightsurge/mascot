# Derived from https://github.com/r-lib/actions/tree/v2/examples (pkgdown.yaml).
# Builds the pkgdown site from main only (a rule, #127): on every push to main, and by hand on main. Never on pull
# requests: the site will take its theme from a private theme package, which pull requests from outside contributors
# can't install. Uploads the site as an artifact (download, unzip, open index.html). No deploy yet: GitHub Pages on a
# private repo needs a paid plan; add the deploy step once the repo is public (#115).
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    # A run started by hand on another branch does nothing: the site is built from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check the site configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      # tools/build-site.R keeps CLAUDE.md and AGENTS.md out of the site (pkgdown renders every top-level .md).
      - name: Build the site
        run: Rscript tools/build-site.R

      - uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site
          path: site/
          retention-days: 14
