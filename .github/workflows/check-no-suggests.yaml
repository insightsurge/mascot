# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-no-suggests.yaml).
# R CMD check with only the hard dependencies (Depends, Imports) installed, plus testthat, knitr and rmarkdown.
# CRAN also checks packages without their Suggests: every use of a suggested package must be guarded. A pull request
# that changes only documentation starts the job and skips its steps (.github/scripts/r-changes.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: check-no-suggests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-no-suggests:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 45  # one R CMD check without the Suggests: about 5 min, plus room for a slow package mirror
    # (setup alone once took 19 min)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - name: List the Suggests that are installed (only testthat, knitr, rmarkdown expected)
        if: steps.changes.outputs.r == 'true'
        shell: Rscript {0}
        run: |
          sugg <- trimws(strsplit(read.dcf("DESCRIPTION", fields = "Suggests")[[1]], ",")[[1]])
          sugg <- sub("[ (].*$", "", sugg)
          installed <- sugg[vapply(sugg, requireNamespace, logical(1), quietly = TRUE)]
          message("Suggests installed: ", if (length(installed)) toString(installed) else "none")

      - uses: r-lib/actions/check-r-package@v2
        if: steps.changes.outputs.r == 'true'
        env:
          # As in R-CMD-check.yaml: skip only the remote CRAN-incoming checks (the "New submission" note).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          _R_CHECK_FORCE_SUGGESTS_: false
          # As CRAN: setup-r sets NOT_CRAN to true, which would run the browser tests here when their packages exist.
          NOT_CRAN: false
          # The whole test output when a test fails, not only its last 13 lines.
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
