name: Feature
description: Something new the package should do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What a user can do once this exists, and why it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist that can be tested.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Known users affected
      description: Rows of docs/consumers.md this touches, if any.
