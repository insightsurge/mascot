# Derived from https://github.com/r-lib/actions/tree/v2/examples (pkgdown.yaml).
# Builds the pkgdown site from main only (a rule, #127): on every push to main, and by hand on main. Never on pull
# requests: a site build may need packages that pull requests from outside contributors can't install. Deploys the
# site to GitHub Pages (https://insightsurge.github.io/mascot/; the repository's Pages source is "GitHub Actions").
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    # A run started by hand on another branch does nothing: the site is built from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 30  # renders every article, then deploys (longest recent run: 4 min)
    permissions:
      contents: read
      pages: write     # publish to GitHub Pages
      id-token: write  # proves to Pages that this workflow made the site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check the site configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      # tools/build-site.R keeps CLAUDE.md and AGENTS.md out of the site (pkgdown renders every top-level .md).
      - name: Build the site
        run: Rscript tools/build-site.R

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
