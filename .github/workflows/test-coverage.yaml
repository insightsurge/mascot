# Derived from https://github.com/r-lib/actions/tree/v2/examples (test-coverage.yaml), without Codecov
# (the repo is private). Fails when line coverage is under 90% (CLAUDE.md, "Testing").
on:
  push:
    branches: [main]
  pull_request:
    # Changes that can't affect the package skip this job (project docs, agent files, templates, the site's theme).
    paths-ignore:
      - "docs/**"
      - "dev/**"
      - ".claude/**"
      - ".agents/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "LICENSE.md"
      - ".github/CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/release.yml"
      - "pkgdown/**"
      - "_pkgdown.yml"
      - "tools/build-site.R"
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the tests CRAN skips (shinytest2 needs Chrome, which the runner has), so they count towards coverage.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage (at least 90%)
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          if (nrow(as.data.frame(cov)) == 0) {
            message("No R code lines to cover yet: the 90% gate applies once there is code.")
          } else {
            pct <- covr::percent_coverage(cov)
            message(sprintf("Line coverage: %.1f%%", pct))
            if (pct < 90) stop(sprintf("Coverage %.1f%% is under 90%%.", pct), call. = FALSE)
          }
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
