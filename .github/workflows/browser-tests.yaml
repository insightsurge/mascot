# Runs the whole test suite with Chrome, so the browser tests (shinytest2 and chromote) run; R CMD check and the
# coverage job skip them, as CRAN does. One line per test file as it finishes shows the progress while the job runs,
# and a failing test prints in full. A pull request that changes only documentation starts the job and skips its
# steps (.github/scripts/r-changes.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC, with R-CMD-check: catches a new Chrome or shinytest2

name: browser-tests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    name: browser-tests
    timeout-minutes: 60  # the whole suite with Chrome

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the tests CRAN skips: the browser tests (the runner has Chrome).
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: local::.
          needs: check

      - name: Run the tests with Chrome
        if: steps.changes.outputs.r == 'true'
        shell: Rscript {0}
        run: |
          chrome <- chromote::find_chrome()
          if (is.null(chrome)) stop("No Chrome on this runner: the browser tests would all skip.", call. = FALSE)
          message("Chrome: ", system2(chrome, "--version", stdout = TRUE))
          library(testthat)
          library(mascot)
          # A line per file when it finishes (update_interval = Inf: no progress spinner in a log); failures in full.
          results <- testthat::test_dir(
            "tests/testthat",
            package = "mascot",
            load_package = "installed",
            reporter = testthat::ProgressReporter$new(show_praise = FALSE, update_interval = Inf),
            stop_on_failure = FALSE
          )
          # A Chrome that keeps stopping skips the remaining browser tests; this job is for them, so that fails too.
          skips <- unlist(lapply(results, function(test) {
            vapply(Filter(function(e) inherits(e, "expectation_skip"), test$results), conditionMessage, character(1))
          }))
          chrome_skips <- unique(grep("Chrome", skips, value = TRUE))
          if (length(chrome_skips) > 0L) message("Skipped for Chrome: ", paste(chrome_skips, collapse = "; "))
          failed <- as.data.frame(results)
          if (any(failed$failed > 0L | failed$error) || length(chrome_skips) > 0L) {
            stop("Browser tests failed or were skipped; see above.", call. = FALSE)
          }
