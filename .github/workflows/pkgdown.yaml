# Builds the pkgdown site from main only, never on pull requests (a site build may need packages that outside
# contributors' pull requests can't install), and publishes it to GitHub Pages (the repository's Pages source is
# "GitHub Actions"; the address is `url` in _pkgdown.yml). The build is launchR's; this file says when it runs.
name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read

# A deploy that has started finishes; the next push waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  site:
    uses: insightsurge/launchR/.github/workflows/pkgdown.yaml@v0.0.19
    permissions:
      contents: read
      pages: write
      id-token: write
