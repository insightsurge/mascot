# Tests the gate itself (tools/test-cran-gate.R): plants one defect per gate step in a copy of the
# package and fails unless the gate reports FAIL for that step. Runs only when the gate or the settings it reads
# change, and on demand.
on:
  pull_request:
    paths:
      - "tools/cran-gate.R"
      - "tools/test-cran-gate.R"
      - ".lintr"
      - "air.toml"
      - "biome.json"
      - ".github/workflows/gate-self-test.yaml"
  workflow_dispatch:

name: gate-self-test

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-self-test:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Same tool versions as lint.yaml: keep the two in step.
      - uses: posit-dev/setup-air@cf390573ff4fe0f198f35df3a642b1409328d859 # v1.0.1
        with:
          version: "0.11.0"

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.5.14"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::devtools, any::roxygen2, any::lintr, any::spelling, any::checkmate, any::cli, any::covr,
            any::withr, any::pkgbuild, any::processx, local::.
          # local::. installs this package: browser tests start apps in a child R process, which needs it installed.

      - name: Gate self-test (every step must fail on its planted defect)
        run: Rscript tools/test-cran-gate.R all
