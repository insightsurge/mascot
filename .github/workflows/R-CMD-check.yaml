# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-standard.yaml).
# The repo rule is 0 errors, 0 warnings, 0 notes, so any note fails the check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Ubuntu pinned like the repo's other workflows: moved deliberately, not by the ubuntu-latest rollout.
          - {os: ubuntu-26.04,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-26.04,   r: 'release'}
          - {os: ubuntu-26.04,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          # Skip only the remote CRAN-incoming checks: they always give a "New submission" note for an
          # unreleased package (explained in cran-comments.md when we submit) and can't reach a private repo's URLs.
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
