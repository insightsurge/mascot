name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests: one group per branch, superseded scans are cancelled. main: one group per commit, so every pushed
# commit is scanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: not required for repos on a personal account.
          # No pull-request comments: a fork's token is read-only, so a comment would fail the scan.
          GITLEAKS_ENABLE_COMMENTS: false
