# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-standard.yaml).
# The repo rule is 0 errors, 0 warnings, 0 notes, so any note fails the check.
# Every pull request, push to main and weekly run checks the full matrix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC: catches changes in R-devel and in dependencies

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60  # R CMD check on one platform (longest recent job: 21 min)

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned like the repo's other workflows.
        config:
          - {os: 'macos-latest', r: 'release'}
          - {os: 'windows-latest', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'devel', http-user-agent: 'release'}
          - {os: 'ubuntu-26.04', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'oldrel-1'}
          - {os: 'ubuntu-26.04', r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          # Skip only the remote CRAN-incoming checks: they always give a "New submission" note for an
          # unreleased package (explained in cran-comments.md when we submit).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  # One check name for the branch ruleset to require: it fails unless every matrix job above succeeded.
  R-CMD-check:
    needs: check
    if: always()
    runs-on: ubuntu-26.04
    name: R-CMD-check
    timeout-minutes: 5  # only reads the matrix result
    steps:
      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = "success"
