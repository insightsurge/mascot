# Throwaway workflow for the repro branch: runs only the failing browser-test files on the runners where they failed.
on:
  pull_request:
  workflow_dispatch:

name: repro-browser-tests

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: 'ubuntu-26.04', r: 'release', repeats: '0', files: 'test-aaa-ci-probe.R test-helper-chrome.R test-studio-app.R test-studio-theme.R'}
          - {os: 'ubuntu-26.04', r: 'devel', http-user-agent: 'release', repeats: '15', files: 'test-aaa-ci-probe.R test-examples.R test-update-mascot.R'}
          - {os: 'macos-latest', r: 'release', repeats: '0', files: 'test-aaa-ci-probe.R test-engine-runtime-app.R test-host-js.R test-studio-theme.R test-studio-app.R'}
          - {os: 'windows-latest', r: 'release', repeats: '0', files: 'test-aaa-ci-probe.R test-engine-runtime-app.R test-studio-theme.R'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      REPRO_FILES: ${{ matrix.config.files }}
      PROBE_REPEATS: ${{ matrix.config.repeats }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run the failing test files
        run: Rscript dev/ci-repro.R
