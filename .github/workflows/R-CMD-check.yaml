# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-standard.yaml).
# The repo rule is 0 errors, 0 warnings, 0 notes, so any note fails the check. As on CRAN, the browser, snapshot and
# extended tests skip here: off-cran-tests.yaml runs them. Every pull request, push to main, weekly run and manual run
# checks the full matrix. On Ubuntu with R release the check also fails when the tests take longer than the limit, so
# the time CRAN spends on them stays well inside its 10 minutes for the whole check. The weekly and manual runs also
# check macOS and Windows with the extended tests turned on (the extended job), the only place they meet those systems.
# The R-CMD-check line of the pull request's CI report (.github/pr-report.json) says whether every platform passed and
# how long the tests took against the limit. A pull request that changes only documentation starts the jobs and skips
# their steps (.github/scripts/r-changes.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC: catches changes in R-devel and in dependencies

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    outputs:
      # Whether the R steps ran (false for a pull request that changes only documentation), for the report line.
      r: ${{ steps.changes.outputs.r }}
    timeout-minutes: 120  # about twice the slowest run: R-devel took 56 min on a slow day (installing R 12-20 min
    # from a slow package mirror, then building packages from source); usually 7-14 min

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned like the repo's other workflows.
        config:
          - {os: 'macos-latest', r: 'release'}
          - {os: 'windows-latest', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'devel', http-user-agent: 'release'}
          - {os: 'ubuntu-26.04', r: 'release'}
          - {os: 'ubuntu-26.04', r: 'oldrel-1'}
          - {os: 'ubuntu-26.04', r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Note when the check starts
        if: steps.changes.outputs.r == 'true'
        shell: bash
        run: echo "CHECK_START=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: r-lib/actions/check-r-package@v2
        if: steps.changes.outputs.r == 'true'
        env:
          # Skip only the remote CRAN-incoming checks: they always give a "New submission" note for an
          # unreleased package (explained in cran-comments.md when we submit).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN: setup-r sets NOT_CRAN to true, which would run the browser tests here too.
          NOT_CRAN: false
          # As CRAN: a note when the tests use more than 2.5 times as much CPU time as elapsed time. testthat runs the
          # test files in two processes (Config/testthat/parallel in DESCRIPTION), which uses about twice as much.
          _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
          # The whole test output when a test fails, not only its last 13 lines.
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      # Each platform's times for the CI report: the tests' elapsed time from 00check.log and the whole check from the
      # clock (.github/scripts/check-times.sh). On Ubuntu with R release the tests are also held to a limit, with room
      # for the package to grow: CRAN asks for examples, vignettes and tests to take under 10 minutes together, and
      # its Windows machine has run tests more than twice as slowly as its Debian one. Here they took 384-503 s before
      # the example apps' detailed tests moved to -extended.R files (#568). One runner only, so the figure stays
      # comparable from run to run.
      - name: Note the check's times
        if: always() && steps.changes.outputs.r == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.config.os }}, R ${{ matrix.config.r }}
          STATUS: ${{ job.status }}
          LIMIT_SECONDS: ${{ matrix.config.os == 'ubuntu-26.04' && matrix.config.r == 'release' && '180' || '' }}
          OUT: ${{ runner.temp }}/check-time-${{ strategy.job-index }}.txt
        run: bash .github/scripts/check-times.sh note

      - name: Keep the check's times
        if: always() && steps.changes.outputs.r == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: check-time-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check-time-${{ strategy.job-index }}.txt
          if-no-files-found: ignore
          overwrite: true  # a re-run job replaces it

  # Weekly and on demand: R CMD check on macOS and Windows with the extended tests turned on (EXTENDED_TESTS),
  # which the pull requests run only on Ubuntu (the coverage and off-CRAN jobs). The browser tests still skip: they
  # need Chrome. Not part of the R-CMD-check summary: a failure here is a warning to fix before the next release.
  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # as the check job: installing R 4.1 and building packages from source can be slow
    # No name of its own: GitHub names each run "extended (os, r)", and a skipped job (every pull request) just
    # "extended". A name built from the matrix would show unfilled on a skipped job.

    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest', 'windows-latest']
        r: ['release', '4.1']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN, apart from the extended tests: the browser tests skip.
          NOT_CRAN: false
          EXTENDED_TESTS: true
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          # The extended tests make the check slower than CRAN's: only errors and warnings count here.
          error-on: '"warning"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  # One stable check name that sums up the jobs above (a branch ruleset could require it): it fails unless every
  # matrix job above succeeded.
  R-CMD-check:
    needs: check
    if: always()
    runs-on: ubuntu-26.04
    name: R-CMD-check
    timeout-minutes: 5  # reads the matrix result and the platforms' times
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Get the platforms' times
        uses: actions/download-artifact@v8
        continue-on-error: true  # none when the R steps were skipped or every check stopped first
        with:
          pattern: check-time-*
          merge-multiple: true
          path: ${{ runner.temp }}/check-times

      # Plain shell: this job's runner has no R.
      - name: Write the report
        env:
          DIR: ${{ runner.temp }}/check-times
          RESULT: ${{ needs.check.result }}
          R_STEPS: ${{ needs.check.outputs.r }}
          OUT: ${{ runner.temp }}/check-part.md
        run: bash .github/scripts/check-times.sh report

      - name: Keep the report
        uses: ./.github/actions/pr-report-part
        with:
          name: tests-0-check
          file: ${{ runner.temp }}/check-part.md

      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = "success"

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summaries only: their token can't write to the pull request.
  report:
    needs: [check, R-CMD-check]  # after the summary job too, so the run counts as finished
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request, across the workflows that write the comment.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.github/actions/pr-report-comment
        with:
          config: .github/pr-report.json
