# Groups the notes that GitHub generates for a release, by PR label.
changelog:
  exclude:
    labels: [skip-release-notes]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
