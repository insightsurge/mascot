# Runs the gate's lint mode (tools/cran-gate.R): Air formatting, Biome on JS/CSS in inst/, docs in
# sync with roxygen, lintr, \value on exported functions, spelling. R CMD check doesn't cover these.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: lint

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: posit-dev/setup-air@cf390573ff4fe0f198f35df3a642b1409328d859 # v1.0.1
        with:
          version: "0.11.0"   # keep in step with the local install (air --version)

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.5.14"   # keep in step with biome.json's $schema

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::roxygen2, any::lintr, any::spelling, any::checkmate, any::cli
          needs: lint

      - name: Gate (lint mode)
        run: Rscript tools/cran-gate.R lint
